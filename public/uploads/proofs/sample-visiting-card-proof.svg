<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1050" height="600" fill="#f1f5f9" />

  <!-- Proof Header Overlay -->
  <rect x="0" y="0" width="1050" height="42" fill="#0f172a" />
  <text x="25" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#a3e635" letter-spacing="1">
    CRYSTAL PRESS • DIGITAL PROOF VERIFICATION DOCKET
  </text>
  <text x="1025" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">
    JOB #JO-2026-0003 • 350 GSM VELVET MATTE + SPOT UV
  </text>

  <!-- Visiting Card Preview Container -->
  <g transform="translate(100, 75)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="850" height="480" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />

    <!-- Modern Geometric Accent -->
    <path d="M 0,0 L 320,0 L 220,480 L 0,480 Z" fill="#1e293b" opacity="0.6" />
    <polygon points="215,0 230,0 130,480 115,480" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Shop / Brand Logo -->
    <g transform="translate(60, 60)">
      <rect width="60" height="60" rx="14" fill="url(#limeGrad)" />
      <path d="M 20,42 L 30,18 L 40,42 L 34,42 L 30,30 L 26,42 Z" fill="#0f172a" />
      <circle cx="30" cy="22" r="3" fill="#0f172a" />
      <text x="75" y="32" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
        RAJESH GRAPHICS
      </text>
      <text x="75" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
        &amp; COMMERCIAL PRINTERS
      </text>
    </g>

    <!-- Person Details -->
    <g transform="translate(480, 160)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff">
        Rajesh V. Patel
      </text>
      <text x="0" y="28" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1">
        MANAGING DIRECTOR
      </text>
      <rect x="0" y="44" width="80" height="4" fill="url(#goldGrad)" rx="2" />
    </g>

    <!-- Contact Details -->
    <g transform="translate(480, 260)" font-family="-apple-system, sans-serif" font-size="15" fill="#e2e8f0">
      <!-- Phone -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="0" r="14" fill="#334155" />
        <text x="12" y="5" font-size="13" text-anchor="middle" fill="#a3e635">📞</text>
        <text x="38" y="5" font-weight="700">+91 98230 11223 / +91 94220 55443</text>
      </g>

      <!-- Email -->
      <g transform="translate(0, 45)">
        <circle cx="12" cy="0" r="14" fill="#334155" />
        <text x="12" y="5" font-size="13" text-anchor="middle" fill="#a3e635">✉️</text>
        <text x="38" y="5" font-weight="600">contact@rajeshgraphics.com</text>
      </g>

      <!-- Address -->
      <g transform="translate(0, 90)">
        <circle cx="12" cy="0" r="14" fill="#334155" />
        <text x="12" y="5" font-size="13" text-anchor="middle" fill="#a3e635">📍</text>
        <text x="38" y="5" font-weight="600">Plot 42, Industrial Estate, Ring Road, Pune - 411038</text>
      </g>
    </g>

    <!-- Spot UV Highlight Badge -->
    <g transform="translate(60, 390)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="105" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
        ✨ SPOT UV + GOLD EMBOSS
      </text>
    </g>
  </g>
</svg>
